name: Windows package check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: node node_modules/electron-builder/cli.js --win --publish never
      - run: node scripts/smoke-package.js dist/win-unpacked/key.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package-check
          path: |
            dist/key-setup-*.exe
            dist/latest.yml
            dist/*.blockmap
            dist/smoke-*/startup.png
            dist/smoke-*/logs/*.txt
